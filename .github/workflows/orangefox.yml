name: Build OrangeFox Recovery (tucana) BY LIECO(TI)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build OrangeFox by GitHub Actions
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Cleanup Space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/lib/jvm
        sudo apt-get clean
        df -h

    - name: Set up Environment & Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
          libc6-dev lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev \
          realpath libxml2-utils xsltproc unzip python2 python3 ccache

    - name: Install Python 2
      run: |
        sudo apt-get update
        sudo apt-get install -y software-properties-common
        sudo add-apt-repository universe
        sudo apt-get install -y python2 curl
        sudo ln -sf /usr/bin/python2 /usr/bin/python

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Sync OrangeFox Source
      run: |
        mkdir -p ~/fox_12.1
        cd ~/fox_12.1
        git clone https://gitlab.com/OrangeFox/sync.git
        cd sync
        ./orangefox_sync.sh --branch 12.1 --path ~/fox_12.1

    - name: Clone Device Tree
      run: |
        cd ~/fox_12.1
        git clone ${{ github.server_url }}/${{ github.repository }} device/xiaomi/tucana

    - name: Build OrangeFox
      run: |
        cd ~/fox_12.1
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_BUILD_DEVICE="tucana"
        export LC_ALL="C"

        export OF_DEFAULT_KEYMASTER_VERSION="4.0"
        export OF_FORCE_PREBUILT_KERNEL=1

        source build/envsetup.sh
        lunch omni_tucana-eng
        mka recoveryimage

    - name: Upload Recovery Image
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-tucana-build
        path: |
          ~/fox_12.1/out/target/product/tucana/OrangeFox*.img
          ~/fox_12.1/out/target/product/tucana/OrangeFox*.zip
